schema_version: 1

context:
  name: docker-squash
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 728023ffedaab424d15c3f97d11c6c9f43eb45c49d735c399e074377229242b7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - docker-squash=docker_squash.cli:run

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - docker-py
    - six
    - packaging

tests:
  - python:
      imports:
        - docker_squash
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
    script:
      - docker-squash --help

about:
  summary: Docker layer squashing tool
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/goldmann/docker-squash

extra:
  recipe-maintainers:
    - janjagusch
